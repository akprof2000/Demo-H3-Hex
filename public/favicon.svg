<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 🎨 Тёмная подложка под цвет демо (#0d1117), скруглённая -->
  <rect width="64" height="64" rx="12" fill="#0d1117" />
  <!-- 🕸️ Семь гексагонов: центральный и кольцо соседей — узнаваемый мотив H3.
       Гексагон «плоским верхом» вписан в сетку с шагом 16 по X и 14 по Y. -->
  <g fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linejoin="round">
    <!-- центральный -->
    <path d="M32 18 l8 5 v10 l-8 5 -8 -5 v-10 z" />
    <!-- верхний и нижний -->
    <path d="M32 4 l8 5 v10 l-8 5 -8 -5 v-10 z" opacity=".55" />
    <path d="M32 32 l8 5 v10 l-8 5 -8 -5 v-10 z" opacity=".55" />
    <!-- четыре боковых, сдвинуты на полшага по вертикали -->
    <path d="M16 11 l8 5 v10 l-8 5 -8 -5 v-10 z" opacity=".35" />
    <path d="M48 11 l8 5 v10 l-8 5 -8 -5 v-10 z" opacity=".35" />
    <path d="M16 25 l8 5 v10 l-8 5 -8 -5 v-10 z" opacity=".35" />
    <path d="M48 25 l8 5 v10 l-8 5 -8 -5 v-10 z" opacity=".35" />
  </g>
</svg>
